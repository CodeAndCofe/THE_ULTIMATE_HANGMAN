<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>The Ultimate Hangman</title>
</head>
<body>
  <main class="game-shell" aria-live="polite">
    <header class="game-header">
      <p class="tag">Guess the hidden word</p>
      <h1>The Ultimate Hangman</h1>
      <p class="subtitle">Pick letters before you run out of attempts.</p>
    </header>

    <section class="status-row" aria-label="Game status">
      <div class="status-card">
        <span>Category</span>
        <strong class="category">---</strong>
      </div>
      <div class="status-card">
        <span>Attempts left</span>
        <strong class="tries">0</strong>
      </div>
      <div class="status-card wide">
        <span>Used letters</span>
        <strong class="used-letters">None yet</strong>
      </div>
    </section>

    <section class="board" aria-label="Current answer">
      <h2 class="question"></h2>
      <div class="answer-slots" role="list"></div>
      <p class="message">Choose a letter to start.</p>
    </section>

    <section class="keyboard-panel" aria-label="Letter keyboard">
      <div class="keyboard"></div>
      <div class="actions">
        <button class="btn btn-secondary restart" type="button">Restart round</button>
        <button class="btn btn-primary new-round" type="button">New random word</button>
      </div>
    </section>
  </main>

  <div class="overlay hidden" role="dialog" aria-modal="true" aria-label="Round result">
    <div class="overlay-card">
      <img src="losingImage.jpeg" alt="Hangman style illustration" class="overlay-image">
      <h3 class="overlay-title"></h3>
      <p class="overlay-text"></p>
      <button class="btn btn-primary overlay-action" type="button">Play again</button>
    </div>
  </div>

  <script src="functions.js"></script>
  <script src="script.js"></script>
</body>
</html>
